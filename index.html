<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equine Vet Clinic Desk</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3864">
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a clinic desk — sticky header + tab bar, working panels below; prescription preview looks like the printed sheet. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212e; --muted:#5b6778; --line:#d8dee8;
  --accent:#1f3864; --accent2:#2e75b6; --soft:#e7eef8;
  --ok:#1e7b45; --okbg:#e3f3e8; --warn:#9a6200; --warnbg:#fff1d6; --bad:#a61b1b; --badbg:#fde3e3;
  --input:#fffbea; --inputink:#0b3fb3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --panel:#18202c; --ink:#e7ecf3; --muted:#9aa7b8; --line:#2c3848;
  --accent:#8fb4ff; --accent2:#6aa6e8; --soft:#1e2a3b;
  --ok:#6fd49a; --okbg:#173326; --warn:#f2c46b; --warnbg:#3a2e14; --bad:#ff8a8a; --badbg:#3b1a1a;
  --input:#232c3a; --inputink:#a9c8ff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#18202c; --ink:#e7ecf3; --muted:#9aa7b8; --line:#2c3848;
  --accent:#8fb4ff; --accent2:#6aa6e8; --soft:#1e2a3b;
  --ok:#6fd49a; --okbg:#173326; --warn:#f2c46b; --warnbg:#3a2e14; --bad:#ff8a8a; --badbg:#3b1a1a;
  --input:#232c3a; --inputink:#a9c8ff; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff}
:root[data-theme="dark"] header{background:#13213a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header{background:#13213a}}
.hd{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.hd h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.5px;margin:0;text-wrap:balance}
.hd .sub{opacity:.8;font-size:13px}
.hd .status{margin-left:auto;font-size:13px;opacity:.9}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;background:rgba(0,0,0,.12)}
nav a{color:#fff;text-decoration:none;padding:9px 13px;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;opacity:.85}
nav a.on{border-bottom-color:#9fd0ff;opacity:1}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
main{padding:16px;max-width:1500px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.panel h2{font-family:var(--display);font-size:20px;margin:0 0 10px;color:var(--accent);letter-spacing:.3px}
.panel h3{font-size:15px;margin:12px 0 6px;color:var(--accent)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--inputink);min-width:0;width:100%}
textarea{resize:vertical;min-height:60px}
button{font:inherit;font-weight:600;font-size:14px;padding:7px 12px;border-radius:6px;border:1px solid var(--accent2);background:var(--panel);color:var(--accent);cursor:pointer}
button.pri{background:var(--accent2);color:#fff;border-color:var(--accent2)}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-bad{background:var(--badbg);color:var(--bad)} .p-n{background:var(--soft);color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:var(--soft);color:var(--accent);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.3px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.bad td{background:var(--badbg)}
.pre{white-space:pre-wrap}
.red{color:var(--bad);font-weight:700}
.warnlist{margin:4px 0 0;padding-left:18px;color:var(--bad);font-size:13px}
.note{color:var(--warn);font-size:13px}
.line{border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--panel)}
.line.out{border-left-color:var(--bad)}
.calc{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:14px}
.calc b{font-variant-numeric:tabular-nums}
.info{background:var(--soft);border-radius:8px;padding:10px;font-size:14px}
.info p{margin:3px 0}
.visit{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel)}
.visit .vh{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.visit .vh b{font-size:15px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:14px;margin-top:6px}
.kv div:nth-child(odd){color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.tile .n{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;display:none;z-index:60;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal{background:var(--panel);border-radius:10px;max-width:900px;width:100%;padding:16px;border:1px solid var(--line)}
.modal h2{font-family:var(--display);color:var(--accent);margin:0 0 10px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:12px;margin-bottom:14px}
.progress{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:var(--accent2);width:0}
/* hover pickers */
.pick{position:relative}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.pick-pop{position:absolute;z-index:40;left:0;top:100%;margin-top:2px;display:flex;width:min(760px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pick-pop[hidden]{display:none}
.pick-list{flex:1 1 50%;max-height:340px;overflow:auto;border-right:1px solid var(--line)}
.pick-item{padding:6px 9px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line)}
.pick-item small{display:block;color:var(--muted);font-size:12px}
.pick-item.on,.pick-item:hover{background:var(--soft)}
.pick-info{flex:1 1 50%;padding:10px 12px;font-size:13px;max-height:340px;overflow:auto}
.pick-info h4{margin:0 0 6px;color:var(--accent);font-size:15px}
.pick-info p{margin:3px 0}
@media (max-width:700px){.pick-pop{flex-direction:column}.pick-list{border-right:0;border-bottom:1px solid var(--line);max-height:220px}}
/* printed prescription preview */
.rxsheet{font-family:Arial,Helvetica,sans-serif;font-size:12pt;color:#000;background:#fff;border:1px solid #bbb;padding:18px;max-width:800px}
.rxsheet h1{background:#1f3864;color:#fff;text-align:center;margin:0;padding:6px;font-size:18pt}
.rxsheet h2{background:#2e75b6;color:#fff;text-align:center;margin:0 0 8px;padding:3px;font-size:12pt}
.rxsheet table{font-size:12pt;width:100%;border-collapse:collapse}
.rxsheet td,.rxsheet th{border:1px solid #999;padding:4px 6px;color:#000}
.rxsheet th{background:#1f3864;color:#fff;position:static;text-transform:none;font-size:12pt}
.rxsheet .lab{background:#d9e1f2;font-weight:bold;width:28%}
@media (max-width:640px){.kv{grid-template-columns:1fr}.hd h1{font-size:20px}}
.vtab td{vertical-align:top} .vtab input{width:100%;min-width:70px} .vref{margin-top:2px;white-space:nowrap}
/* notifications */
#notif:empty{display:none}
.notif{max-width:1500px;margin:0 auto;padding:10px 16px 0}
.notif .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.notif .chip{border-radius:999px;padding:4px 12px;font-size:13px}
.notif .chip.bad{border-color:var(--bad);color:var(--bad);background:var(--badbg)} .notif .chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.notif .chip.on{outline:2px solid currentColor}
.notif .list{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:6px 10px;max-height:260px;overflow:auto;margin-top:-4px}
.notif .list button.it{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 4px;background:none;color:var(--ink);font-weight:400}
.notif .list button.it:hover{background:var(--soft)}
/* photos, videos, patient record */
.photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.photos figure{margin:0;width:118px}
.photos .thumb{padding:0;border:1px solid var(--line);border-radius:6px;width:118px;height:118px;overflow:hidden;background:var(--soft);display:block}
.photos .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photos .vid{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--accent);font-size:30px;gap:4px}
.photos .vid small{font-size:11px;color:var(--muted);text-align:center;word-break:break-all;padding:0 4px;line-height:1.2}
.photos figcaption{font-size:12px;min-height:14px;line-height:1.25;margin-top:3px}
.photos figcaption .md{font-weight:700;color:var(--ink)} .photos figcaption .cp{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.photos figcaption .ns{color:var(--warn);font-weight:700}
.photos .x{padding:1px 8px;font-size:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent2);font-weight:700;cursor:pointer;text-decoration:underline;font-size:inherit}
.datehd{font-family:var(--display);font-size:19px;color:#fff;background:var(--accent2);padding:4px 12px;border-radius:6px;margin:16px 0 8px;letter-spacing:.3px}
.printbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.medimg{width:48px;height:48px;border-radius:6px;border:1px solid var(--line);object-fit:cover;display:block;cursor:zoom-in;background:var(--soft)}
.medimg-none{width:48px;height:48px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
.pick-info .mi{float:right;width:90px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin:0 0 6px 8px}
/* global search, notes, investigations */
.gs{position:relative;flex:1 1 300px;max-width:560px;margin-left:auto}
.gs input{background:#fff;color:#18212e;border:1px solid transparent;padding:8px 10px 8px 34px;border-radius:6px}
.gs input::placeholder{color:#6b7686}
.gs .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:14px}
.gs-res{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.28);max-height:72vh;overflow:auto;z-index:45;min-width:280px}
.gs-res[hidden]{display:none}
.gs-g{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);padding:7px 10px 3px;background:var(--soft);position:sticky;top:0}
.gs-it{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--ink);font-weight:400;font-size:14px;padding:7px 10px}
.gs-it small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-it.on,.gs-it:hover{background:var(--soft)}
.gs-it mark,.gs-it small mark{background:var(--warnbg);color:inherit;padding:0 1px;border-radius:2px}
.gs-empty{padding:10px;color:var(--muted);font-size:14px}
.hd .gs ~ .status{margin-left:0}
.hd .hbtn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.45);white-space:nowrap}
@media (max-width:760px){.gs{order:5;flex-basis:100%;max-width:none;margin-left:0}}
.visit.pinned{border-left:4px solid var(--warn)} .visit.done{opacity:.62}
.inv-row{display:grid;grid-template-columns:minmax(120px,1.1fr) 150px minmax(180px,2.2fr) auto;gap:6px;align-items:end;margin-bottom:6px}
.inv-row textarea{min-height:38px;height:38px}
@media (max-width:640px){.inv-row{grid-template-columns:1fr 1fr auto}.inv-row .res{grid-column:1/-1;order:5}}
.pvauto{border:1px dashed var(--accent2);border-radius:8px;padding:10px;margin:8px 0;background:var(--soft)}
.pvauto[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="hd"><h1 id="clinicName">Equine Vet Clinic Desk</h1><span class="sub">Case sheet · Rx calculator · Stock · History</span>
    <div class="gs" role="search"><span class="ic" aria-hidden="true">🔍</span><input id="gsq" type="search" placeholder="Search anything – horse, ID, diagnosis, medicine, stock, note…" autocomplete="off" aria-label="Search everything" aria-controls="gsres"><div class="gs-res" id="gsres" role="listbox" hidden></div></div>
    <button class="hbtn small" id="hNotes" type="button">📝 Notes</button>
    <span class="status" id="status">Connecting…</span></div>
  <nav id="nav">
    <a href="#rx" data-v="rx">New prescription</a>
    <a href="#history" data-v="history">History &amp; search</a>
    <a href="#notes" data-v="notes">Notes</a>
    <a href="#stock" data-v="stock">Stock</a>
    <a href="#meds" data-v="meds">Medicines &amp; doses</a>
    <a href="#finder" data-v="finder">Find &amp; edit</a>
    <a href="#diseases" data-v="diseases">Diseases</a>
    <a href="horse-file.html">Horse File / الملف الشامل</a>
    <a href="#settings" data-v="settings">Settings &amp; lists</a>
  </nav>
</header>
<div id="banner"></div>
<div id="notif"></div>
<main id="main"><div class="panel"><p class="muted">Loading your clinic data…</p></div></main>
<div id="toast" role="status"></div>

const N = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
const fmt = (v, d=2) => { const n = N(v); if (n === null) return ""; return String(+n.toFixed(d)); };
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }; // local date, not UTC
const dshow = s => { if (!s) return "(no date)"; const d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
const L = () => S.lists || SEED.lists;

function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", ms); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function W(fn){ // one write with retry; friendly errors
  if (!db) { toast("Not connected – changes cannot be saved right now."); throw new Error("no db"); }
  for (let i=0;i<4;i++){
    try { return await fn(); }
    catch(e){
      const c = e && String(e.code||"").replace(/-/g,"_").replace(/^firestore\//,"");
      if (c === "resource_exhausted" || c === "unavailable") { await sleep(1500*(i+1)); continue; }
      if (c === "invalid_argument" || c === "permission_denied") { writeBlocked = true; toast(c === "permission_denied" ? "Not allowed – check you are signed in with the authorised email (see README, step 4)." : "Could not save – invalid data."); }
      else if (c === "quota_exceeded") toast("The database is full – delete old records to make room.");
      else toast("Could not save: " + (e && e.message || e));
      throw e;
    }
  }
  toast("The server is busy – please try again in a moment."); throw new Error("busy");
}

/* ---------------- data access ---------------- */
function sub(coll, key){
  db.collection(coll).onSnapshot(snap => {
    S[key] = snap.docs.map(d => Object.assign({_id:d.id}, d.data()));
    if (!snap.metadata.fromCache) S.loaded[key] = true;
    onData();
  }, e => { S.loaded[key] = true; setStatus("Data error: " + e.message); onData(); });
}
function subDoc(path, key){
  db.doc(path).onSnapshot(snap => {
    S[key] = snap.exists ? snap.data() : null;
    if (!snap.metadata.fromCache) S.loaded[key] = true;
    onData();
  }, e => { S.loaded[key] = true; onData(); });
}
function setStatus(t){ $("#status").textContent = t; }
function drawBanner(){
  const b = $("#banner"); if (!b) return;
  const need = db && S.live && S.meds.length && (N(ST().dataVersion) || 1) < SEED.version;
  if (!need) { b.innerHTML = ""; return; }

    composition for your existing medicines, and stock items sorted into Medicines / Consumables / Equipment / Farrier / Tack / Grooming / Feed &amp; hay.
    Your own edits are kept. <button class="pri" id="btnUpd" style="margin-left:8px">Apply update</button> <span id="updMsg" class="small"></span></div></div>`;
  $("#btnUpd").onclick = applyUpdate;

async function applyUpdate(){
  const btn = $("#btnUpd"); btn.disabled = true; const msg = t => { const el = $("#updMsg"); if (el) el.textContent = t; };
  try {
    const byName = new Map(S.meds.map(m=>[m.name, m]));
    let n = 0;
    for (const m of SEED.meds) {
      const ex = byName.get(m.name);
      if (!ex) { await W(()=>db.collection("meds").add(JSON.parse(JSON.stringify(m)))); n++; msg(`Adding medicines… ${n}`); await sleep(100); }
      else if (!ex.composition && m.composition) { await W(()=>db.doc("meds/"+ex._id).update({composition:m.composition})); await sleep(80); }
    }
    const used = new Set(); let k = 0;
    for (const sd of SEED.stock) {
      const ex = S.stock.find(x => !used.has(x._id) && x.item === sd.item); if (!ex) continue; used.add(ex._id);
      const upd = {};
      if (!ex.group) upd.group = sd.group;
      if (!ex.med && sd.med) upd.med = sd.med;
      if (!ex.desc && sd.desc) upd.desc = sd.desc;
      if (Object.keys(upd).length) { await W(()=>db.doc("stock/"+ex._id).update(upd)); k++; msg(`Sorting stock… ${k}`); await sleep(80); }
    }
    const l = Object.assign({}, L());
    l.drugTypes = [...new Set([...(l.drugTypes||[]), ...SEED.lists.drugTypes])];
    l.basis = [...new Set([...(l.basis||[]), ...SEED.lists.basis])];
    l.stockGroups = [...new Set([...(l.stockGroups||[]), ...SEED.lists.stockGroups])];
    await W(()=>db.doc("config/lists").set(l));
    await W(()=>db.doc("config/settings").set(Object.assign({}, ST(), {dataVersion: SEED.version})));
    toast(`Update applied: ${n} medicines added, ${k} stock items sorted.`, 4500);
  } catch(e){ btn.disabled = false; msg("Stopped – press Apply update again to continue."); }
}

function onData(){

  if (keys.every(k => S.loaded[k]) && !S.live) { S.live = true; setStatus(MODE === "firebase" ? "Signed in · synced (works offline)" : "Local mode – saved in this browser only"); $("#clinicName").textContent = ST().clinic || "Equine Vet Clinic Desk"; render(true); drawNotif(); drawHeaderCounts(); syncPrev(); return; }

}
const diseasesAll = () => S.dchunks.length ? S.dchunks.slice().sort((a,b)=>a._id.localeCompare(b._id)).flatMap(c => (c.items||[]).map((x,i)=>Object.assign({_chunk:c._id,_i:i},x))) : [];
const medByName = n => S.meds.find(m => m.name === n);
function stockFor(med){
  const rows = S.stock.filter(s => s.med === med);
  if (!rows.length) return null;
  let u = 0, ml = 0, any = false;
  rows.forEach(s => { const b = N(s.balance); if (b !== null) { any = true; u += b; if (N(s.pack)) ml += b * N(s.pack); } });
  return any ? {units:+u.toFixed(2), ml:Math.round(ml)} : {units:null, ml:0};
}
const stockTxt = med => { const s = stockFor(med); if (!s) return "not in stock list"; if (s.units === null) return "balance not entered"; return fmt(s.units) + " btl" + (s.ml ? " (" + s.ml + " ml)" : ""); };
function stockStatus(s){
  const b = N(s.balance), r = N(s.reorder);
  const exp = s.exp ? new Date(s.exp) : null, now = new Date();
  const tags = [];
  if (b === null) tags.push(["Enter balance","p-n"]);
  else if (b <= 0) tags.push(["SHORT","p-bad"]);
  else if (r !== null && b <= r) tags.push(["Reorder","p-warn"]);
  else tags.push(["OK","p-ok"]);
  if (exp && !isNaN(exp)) { const days = (exp - now)/864e5; if (days < 0) tags.push(["Expired","p-bad"]); else if (days < (N(ST().expiryDays)||60)) tags.push(["Expires soon","p-warn"]); }
  return tags;
}

/* ---------------- dose calculator ---------------- */
function freqInfo(n){ return (L().freqs||[]).find(f => f.n === n) || null; }
function doseOptions(medName){
  const m = medByName(medName); if (!m) return [];
  const o = [];
  const sum = (dose,basis,route,freq,days) => `${fmt(dose,3)} ${basis||""}, ${route||""}, ${freq||""}${days?` x ${days} d`:""}`;
  o.push({key:"A", label:"Adult (default) – " + sum(m.aDose,m.aBasis,m.route,m.freq,m.days)});
  if (N(m.fDose) !== null) o.push({key:"F", label:"Foal (default) – " + sum(m.fDose,m.fBasis||m.aBasis,m.route,m.freq,m.days)});
  S.doses.filter(d => d.med === medName).forEach(d => o.push({key:"D:"+d._id, label:(d.cat||"Option") + " – " + sum(d.dose,d.basis,d.route||m.route,d.freq||m.freq,d.days||m.days)}));
  return o;
}
function calcLine(ln, P){
  const out = {warnings:[], notes:[]};
  const m = medByName(ln.med);
  if (!ln.med) return out;
  const bwt = N(P.bwt), type = P.type || "";
  let src = ln.opt || "";
  if (!src) src = (type === "Foal" && m && N(m.fDose) !== null) ? "F" : "A";
  let o = null;
  if (src.startsWith("D:")) o = S.doses.find(d => "D:"+d._id === src) || null;
  if (src.startsWith("D:") && !o) { out.warnings.push("Dose option no longer exists – default used."); src = "A"; }
  let basis, dose, route, freq, days, pmin, pmax;
  if (m) {
    if (o) { basis=o.basis; dose=N(o.dose); route=o.route||m.route; freq=o.freq||m.freq; days=N(o.days)??N(m.days); pmin=N(o.pmin); pmax=N(o.pmax); }
    else if (src === "F") { basis=m.fBasis||m.aBasis; dose=N(m.fDose); route=m.route; freq=m.freq; days=N(m.days); pmin=N(m.fpmin); pmax=N(m.fpmax); }
    else { basis=m.aBasis; dose=N(m.aDose); route=m.route; freq=m.freq; days=N(m.days); pmin=N(m.pmin); pmax=N(m.pmax); }
  } else out.warnings.push("Not in Medicines – enter basis, dose (and concentration for mg doses).");
  if (m && dose === null && !(basis||"").startsWith("apply")) out.warnings.push("No dose stored for this medicine – enter the dose (override) from the label.");
  const pbasis = basis;
  const ov = ln.ov || {};
  if (ov.basis) basis = ov.basis;
  if (N(ov.dose) !== null) dose = N(ov.dose);
  if (ov.route) route = ov.route;
  if (ov.freq) freq = ov.freq;
  if (N(ov.days) !== null) days = N(ov.days);
  let conc = N(ov.conc) ?? (m ? N(m.conc) : null);
  let vol = null, mg = null;
  if (dose !== null && basis) {
    if (basis.startsWith("apply")) { /* topical – no volume */ }
    else if (basis === "ml/animal") vol = dose;
    else if (bwt === null) out.warnings.push("Enter body weight (BWT).");
    else if (basis === "ml/100kg") vol = dose*bwt/100;
    else if (basis === "ml/kg") vol = dose*bwt;
    else if (basis === "mg/kg") { mg = dose*bwt; if (conc) vol = mg/conc; else out.warnings.push("Concentration needed to get the volume."); }
    else if (basis === "mcg/kg") { mg = dose*bwt/1000; if (conc) vol = mg/conc; else out.warnings.push("Concentration needed to get the volume."); }
    if (mg === null && vol !== null && conc) mg = vol*conc;
  }
  const fi = freqInfo(freq);
  let nd = null;
  if (fi && days !== null) nd = (fi.fixed ? fi.fixed : Math.ceil(+(fi.perDay*days).toFixed(6)));
  const course = (vol !== null && nd !== null) ? vol*nd : null;
  const outside = dose !== null && pmin !== null && pmax !== null && basis === pbasis && (dose < pmin || dose > pmax);
  if (outside) out.warnings.push(`DOSE OUTSIDE PROTOCOL (${fmt(pmin,3)} – ${fmt(pmax,3)} ${pbasis}).`);
  if (m && type === "Foal" && src === "A" && N(m.fDose) === null) out.warnings.push("No foal dose stored – adult dose used, please check.");
  if (m && (type === "Pregnant" || P.preg === "Yes")) {
    if (m.preg === "Avoid") out.warnings.push("AVOID IN PREGNANCY.");
    else if (m.preg === "Caution") out.warnings.push("Caution in pregnancy.");
    else if (m.preg !== "Safe") out.warnings.push("Pregnancy safety not recorded – check label.");
  }
  if (m && type === "Dangerously Ill") out.warnings.push(/NSAID/.test(m.type||"") || /gentamicin|amikacin/i.test(m.name) ? "Critically ill: protect kidneys – check hydration, consider lower dose." : "Critically ill: reassess dose and route.");
  const imMax = N(ST().imMax) || 15;
  if (vol !== null && /\bIM\b/i.test(route||"") && vol > imMax) out.warnings.push(`Volume over ${imMax} ml: split across IM sites.`);
  const sk = stockFor(ln.med);
  if (sk && sk.units !== null && course !== null && sk.ml && course > sk.ml) out.warnings.push(`Not enough stock (${sk.ml} ml available).`);
  if (o && o.note) out.notes.push(o.note);
  if (m && m.note) out.notes.push(m.note);
  Object.assign(out, {m, src, basis, dose, route, freq, days, conc, vol, mg, nd, course, pmin, pmax, pbasis, outside});
  return out;
}

/* ---------------- router ---------------- */
const VIEWS = {rx:renderRx, patient:renderPatient, history:renderHistory, notes:renderNotes, stock:renderStock, meds:renderMeds, finder:renderFinder, diseases:renderDiseases, settings:renderSettings};
let view = "rx";
function route(){ const h = (location.hash||"#rx").slice(1); view = VIEWS[h] ? h : "rx"; document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === view)); render(true); }
window.addEventListener("hashchange", route);
function render(full){
  const main = $("#main");
  if (db && S.live && (S.importing || !S.meds.length)) { main.dataset.v = "import"; main.innerHTML = importPanel(); bindImport(); return; }
  // live data must not interrupt typing: keep forms, refresh only calculated parts
  if (!full && main.dataset.v === view) {
    const a = document.activeElement, typing = a && main.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    if (view === "settings") return;
    if (view === "rx") { if (typing) { refreshRxCalc(); return; } }
    else if (typing) return;
  }
  if (!full && document.querySelector(".modal-bg")) return;
  main.dataset.v = view;
  VIEWS[view](main);
}

  <button class="pri" id="btnImport"${S.importing?" disabled":""}>${S.importing?"Loading…":"Load my starter data"}</button>
  <div class="progress"><div id="impBar" style="width:${S.impTotal?100*S.impDone/S.impTotal:0}%"></div></div><p class="small muted" id="impMsg">${S.impMsg||""}</p></div>`;
}
function bindImport(){
  const b = $("#btnImport"); if (!b || S.importing) return;
  b.onclick = async () => {
    S.importing = true; S.impDone = 0; S.impMsg = "Starting…"; render(true);
    const jobs = [];
    if (!S.settings) jobs.push(["config/settings", SEED.settings, "set"]);
    else jobs.push(["config/settings", {dataVersion: SEED.version}, "update"]);
    if (!S.lists) jobs.push(["config/lists", SEED.lists, "set"]);
    SEED.meds.forEach((m,i) => jobs.push(["meds/m" + String(i+1).padStart(3,"0"), m, "set"]));
    SEED.doses.forEach((d,i) => jobs.push(["doses/d" + String(i+1).padStart(3,"0"), d, "set"]));
    SEED.stock.forEach((x,i) => jobs.push(["stock/s" + String(i+1).padStart(3,"0"), x, "set"]));
    SEED.visits.forEach((v,i) => jobs.push(["visits/h" + String(i+1).padStart(3,"0"), Object.assign({createdAt:new Date().toISOString()}, v), "set"]));
    const per = Math.ceil(SEED.diseases.length/4);
    for (let c=0;c<4;c++) jobs.push(["dchunks/c"+c, {items:SEED.diseases.slice(c*per,(c+1)*per)}, "set"]);
    S.impTotal = jobs.length;
    const ui = () => { const bar = $("#impBar"), m = $("#impMsg"); if (bar) bar.style.width = (100*S.impDone/S.impTotal) + "%"; if (m) m.textContent = S.impMsg; };
    for (const [p, data, op] of jobs) {
      const clean = JSON.parse(JSON.stringify(data, (k,v)=> v===undefined?null:v));
      try { await W(() => op === "update" ? db.doc(p).update(clean) : db.doc(p).set(clean)); }
      catch(e){ S.importing = false; S.impMsg = "Stopped at " + p + ". Press the button again to continue (already saved items are simply rewritten)."; render(true); return; }
      S.impDone++; S.impMsg = `Saved ${S.impDone} of ${S.impTotal}…`; ui();
      if (MODE === "firebase") await sleep(60);
    }
    S.importing = false; S.impMsg = ""; toast("Starter data loaded."); location.hash = "#rx"; render(true);
  };
}

function bindPicker(id, getItems, infoFn, onPick){
  const inp = document.getElementById(id); if (!inp) return;
  const wrap = inp.parentElement, pop = wrap.querySelector(".pick-pop"), list = wrap.querySelector(".pick-list"), info = wrap.querySelector(".pick-info");
  let items = [], hi = -1, orig = inp.value;
  const show = (v) => { info.innerHTML = v ? infoFn(v) : '<span class="muted">Point at an item to see details.</span>'; };
  const draw = () => {
    const q = inp.value === orig ? "" : inp.value.trim().toLowerCase();
    items = getItems().filter(it => !q || (it.label + " " + (it.sub||"")).toLowerCase().includes(q)).slice(0, 300);
    list.innerHTML = items.map((it, k) => `<div class="pick-item${k===hi?" on":""}" data-k="${k}">${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:""}</div>`).join("") || '<div class="pick-item muted">Nothing found</div>';
    list.querySelectorAll("[data-k]").forEach(el => {
      el.addEventListener("mouseenter", () => { hi = +el.dataset.k; list.querySelectorAll(".pick-item").forEach(x=>x.classList.remove("on")); el.classList.add("on"); show(items[hi].value); });
      el.addEventListener("mousedown", e => { e.preventDefault(); pick(+el.dataset.k); });
    });
  };
  const open = () => { orig = inp.value; hi = -1; pop.hidden = false; draw(); show(getItems().some(i=>i.value===orig) ? orig : null); };
  const close = () => { pop.hidden = true; };
  const pick = k => { const it = items[k]; if (!it) return; inp.value = it.label; orig = it.label; close(); onPick(it.value); };
  inp.addEventListener("focus", open);
  inp.addEventListener("click", () => { if (pop.hidden) open(); });
  inp.addEventListener("input", () => { hi = -1; pop.hidden = false; draw(); });
  inp.addEventListener("blur", () => setTimeout(() => { close(); if (!getItems().some(i => i.label === inp.value)) inp.value = orig; }, 150));
  inp.addEventListener("keydown", e => {
    if (pop.hidden && (e.key === "ArrowDown" || e.key === "Enter")) { open(); e.preventDefault(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); hi = Math.max(0, Math.min(items.length-1, hi + (e.key==="ArrowDown"?1:-1))); draw(); if (items[hi]) { show(items[hi].value); const el = list.querySelector(`[data-k="${hi}"]`); if (el) el.scrollIntoView({block:"nearest"}); } }
    else if (e.key === "Enter") { e.preventDefault(); if (hi >= 0) pick(hi); else if (items.length === 1) pick(0); }
    else if (e.key === "Escape") { inp.value = orig; close(); }
  });
}

// Photos: one Firestore doc each (compressed JPEG). Videos: split into ~700 KB pieces (free Firebase plan, no Storage needed).
const CHUNK = 700 * 1024, VIDEO_MAX = 40 * 1024 * 1024;
const fmtSize = b => b >= 1048576 ? (b/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b/1024)) + " KB";
let PEND = [];
window.addEventListener("beforeunload", e => { if (PEND.length) { e.preventDefault(); e.returnValue = ""; } });
async function fileToJpeg(file, max=1600, q=0.82){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("This photo format cannot be read here – try a JPG or PNG.")); i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight; const sc = Math.min(1, max / Math.max(w, h)); w = Math.round(w*sc); h = Math.round(h*sc);
    const c = document.createElement("canvas"); c.width = w; c.height = h; const cx = c.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0,0,w,h); cx.drawImage(img, 0, 0, w, h);
    let d = c.toDataURL("image/jpeg", q); if (d.length > 900000) d = c.toDataURL("image/jpeg", 0.6);
    return d;
  } finally { URL.revokeObjectURL(url); }
}
function readB64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
const localDate = ms => { const d = new Date(ms || Date.now()); return isNaN(d) ? today() : new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
async function prepMedia(file){
  const it = await prepMedia0(file); it.mdate = localDate(file.lastModified); it.caption = ""; return it;
}
async function prepMedia0(file){
  const t = file.type || "";
  if (t.startsWith("image/") || (!t && /\.(jpe?g|png|webp|gif|heic)$/i.test(file.name))) return {kind:"photo", data: await fileToJpeg(file), fname:file.name || "photo.jpg"};
  if (t.startsWith("video/") || (!t && /\.(mp4|mov|webm|3gp|m4v)$/i.test(file.name))) {
    if (file.size > VIDEO_MAX) throw new Error(`This video is ${fmtSize(file.size)} – the limit is ${fmtSize(VIDEO_MAX)}. Trim it on your phone, then add it again.`);
    return {kind:"video", file, fname:file.name || "video.mp4", mime:t || "video/mp4", size:file.size};
  }
  throw new Error("Only photos and videos can be added.");
}
async function uploadMedia(visitId, v, item, onProg){
  const ref = db.collection("media").doc();
  const base = {visitId, pid:v.pid||"", name:v.name||"", date:v.date||"", caption:item.caption||"", mdate:item.mdate||v.date||today(), fname:item.fname||"", at:new Date().toISOString()};
  if (item.kind === "photo") { await W(() => ref.set(Object.assign(base, {kind:"photo", mime:"image/jpeg", data:item.data}))); return; }
  const n = Math.ceil(item.file.size / CHUNK);
  for (let i=0;i<n;i++){
    const b64 = await readB64(item.file.slice(i*CHUNK, (i+1)*CHUNK));
    await W(() => db.doc(`mediaChunks/${ref.id}_${i}`).set({mediaId:ref.id, i, data:b64}));
    if (onProg) onProg(i+1, n);
  }
  await W(() => ref.set(Object.assign(base, {kind:"video", mime:item.mime || "video/mp4", size:item.size, chunks:n})));
}
async function loadMedia(visitIds){

    try { const snap = await db.collection("media").where("visitId", "==", id).get(); out[id] = snap.docs.map(d => Object.assign({_id:d.id}, d.data())).sort((a,b)=>(a.mdate||"").localeCompare(b.mdate||"") || (a.at||"").localeCompare(b.at||"")); }
    catch(e){ out[id] = []; }
  }));
  return out;
}
async function deleteMedia(m){

  await W(() => db.doc("media/" + m._id).delete());
}
async function mediaBlob(m){
  if (m.file) return m.file;
  if (m.kind === "photo") { const bin = atob(String(m.data).split(",")[1] || ""); const u = new Uint8Array(bin.length); for (let j=0;j<bin.length;j++) u[j] = bin.charCodeAt(j); return new Blob([u], {type:"image/jpeg"}); }
  const parts = [];
  for (let i=0;i<(m.chunks||0);i++){
    const s = await db.doc(`mediaChunks/${m._id}_${i}`).get();
    if (!s.exists) throw new Error("Part of this video is missing.");
    const bin = atob(s.data().data || ""); const u = new Uint8Array(bin.length); for (let j=0;j<bin.length;j++) u[j] = bin.charCodeAt(j); parts.push(u);
  }
  return new Blob(parts, {type:m.mime || "video/mp4"});
}

/* ---------------- vaccination & deworming ---------------- */
const KLAB = {vacc:"Vaccination", deworm:"Deworming"};
let histMode = "visits", prevQ = "", prevF = "all", notifOpen = "", notifHidden = false;
const remindDays = () => { const n = N(ST().remindDays); return n === null ? 14 : n; };
const daysUntil = d => Math.round((new Date(d + "T00:00:00") - new Date(today() + "T00:00:00")) / 864e5);
function addMonths(d, n){ const x = new Date((d || today()) + "T00:00:00"); if (isNaN(x)) return ""; const day = x.getDate(); x.setMonth(x.getMonth() + n); if (x.getDate() < day) x.setDate(0); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; }
const prevKey = r => [r.kind, String(r.name || r.pid || "").trim().toLowerCase(), String(r.drug || "").trim().toLowerCase()].join("|");
function latestPrev(){
  const m = new Map();
  S.preventive.forEach(r => { const k = prevKey(r), o = m.get(k); if (!o || (r.given||"") > (o.given||"") || ((r.given||"") === (o.given||"") && (r.at||"") > (o.at||""))) m.set(k, r); });
  return m;
}
function prevStatus(r, latest){
  if (!r.next) return ["No next date","p-n"];
  const l = (latest || latestPrev()).get(prevKey(r)); if (l && l._id !== r._id) return ["Done (repeated)","p-n"];
  const d = daysUntil(r.next);
  if (d < 0) return [`Overdue ${-d} d`,"p-bad"];
  if (d <= remindDays()) return [d === 0 ? "Due today" : `Due in ${d} d`,"p-warn"];
  return ["OK","p-ok"];
}
function dueList(kind){ return [...latestPrev().values()].filter(r => r.kind === kind && r.next && daysUntil(r.next) <= remindDays()).sort((a,b) => (a.next||"").localeCompare(b.next||"")); }

function bindHistSel(){ const h = $("#hmode"); if (h) h.onchange = e => { histMode = e.target.value; render(true); }; }
function renderPrevList(main){

    <p class="small muted" id="pvcount"></p>
    <div class="tbl"><table><thead><tr><th>Horse</th><th>ID</th><th>Name of drug</th><th>Given date</th><th>Next date</th><th>Status</th><th>Note</th><th></th></tr></thead><tbody id="pvbody"></tbody></table></div>
    <p class="small muted">“Due” means the next date is within ${remindDays()} days (change this in Settings). When you give the same drug again, the older record shows “Done”.</p></div>`;

      .sort((a,b) => prevF === "due" ? (a.next||"").localeCompare(b.next||"") : (b.given||"").localeCompare(a.given||""));
    $("#pvcount").textContent = `${shown.length} record(s)` + (q ? ` matching “${prevQ}”` : "");
    $("#pvbody").innerHTML = shown.map(r => { const st = prevStatus(r, latest);
      return `<tr class="${st[1]==="p-bad"?"bad":""}"><td><button class="linkbtn" data-pat="1" data-pid="${esc(r.pid||"")}" data-pname="${esc(r.name||"")}">${esc(r.name || r.pid || "(no name)")}</button></td><td>${esc(r.pid||"")}</td><td><b>${esc(r.drug||"")}</b></td>

// Which prescription medicines count as a vaccination or a deworming
function prevKindOf(medName){
  const m = medByName(medName) || {};
  const head = [m.type, medName].join(" "), all = [m.type, medName, m.function, m.indication].join(" ");
  if (/vaccin|toxoid/i.test(head)) return "vacc";
  const drug = /dewor|anthelm|ivermect|fenbend|phenbend|pyrantel|praziq|moxidect|abamect|oxibend|equimax|eqvalan/i;
  if (drug.test(medName) || (/antiparasit|anthelm/i.test(m.type || "") && (drug.test(all) || /tapeworm|roundworm|strongyl/i.test(all)))) return "deworm";
  return null;
}
function prevAutoList(){

const RECENT_V = []; // visits created in this session that the live list may not show yet
async function linkPrev(id, rec){
  if (!rec.given) return null;
  const pool = [...S.visits, ...RECENT_V.filter(r => !S.visits.some(v => v._id === r._id))];
  const v = pool.find(x => x.date === rec.given && sameHorse(x, rec) && x.auto !== "prev") || pool.find(x => x.date === rec.given && sameHorse(x, rec));

    const ref = db.collection("visits").doc();

      td:"Vaccination / deworming", rx:"", auto:"prev", source:"Vaccination / deworming record", createdAt:new Date().toISOString()};

// One-time: link older vaccination / deworming records (saved before this update) to History
let prevSynced = false;
async function syncPrev(){
  if (prevSynced || !db || !S.live || writeBlocked || !S.loaded.preventive || !S.loaded.visits) return;
  prevSynced = true;
  const todo = S.preventive.filter(p => p.given && (!p.visitId || !S.visits.some(v => v._id === p.visitId)));
  if (!todo.length) return;
  let n = 0;
  for (const p of todo) {
    const cur = S.preventive.find(x => x._id === p._id);

    try { await linkPrev(cur._id, cur); n++; } catch(e){ break; }
    if (MODE === "firebase") await sleep(80);

/* ---------------- global search (header) ---------------- */
const GS = {items:[], hi:-1};
function gsHi(text, q){
  const t = String(text ?? ""), lo = t.toLowerCase(), mk = new Array(t.length).fill(false);
  q.forEach(w => { let i = lo.indexOf(w); while (w && i >= 0) { for (let k = i; k < i + w.length; k++) mk[k] = true; i = lo.indexOf(w, i + w.length); } });
  let out = "", on = false;
  for (let i = 0; i < t.length; i++) { if (mk[i] !== on) { out += mk[i] ? "<mark>" : "</mark>"; on = mk[i]; } out += esc(t[i]); }
  return out + (on ? "</mark>" : "");
}
function gsSnip(fields, q){ // first field that contains a search word, cut around it
  for (const f of fields) { const t = String(f || "").replace(/\s+/g, " "), lo = t.toLowerCase(); for (const w of q) { const i = lo.indexOf(w); if (i >= 0) { const s = Math.max(0, i - 35); return (s ? "…" : "") + t.slice(s, s + 110) + (s + 110 < t.length ? "…" : ""); } } }
  return "";
}
function gsSearch(raw){
  const q = hk(raw).split(/\s+/).filter(Boolean); if (!q.length) return [];
  const has = (...f) => { const s = f.map(x => String(x ?? "")).join(" ").toLowerCase(); return q.every(w => s.includes(w)); };
  const out = [], add = (group, label, sub, act) => out.push({group, label, sub, act});
  // horses
  const H = new Map();
  [...S.visits, ...S.preventive, ...S.notes].forEach(x => { const k = hk(x.name) || hk(x.pid); if (!k) return;
    const h = H.get(k) || {pid:"", name:"", breed:"", n:0, last:""}; if (x.pid) h.pid = x.pid; if (x.name) h.name = x.name; if (x.breed) h.breed = x.breed;
    if (x.createdAt !== undefined || x.td !== undefined) { h.n++; if ((x.date||"") > h.last) h.last = x.date || ""; } H.set(k, h); });
  [...H.values()].filter(h => has(h.name, h.pid, h.breed)).sort((a,b) => (b.last||"").localeCompare(a.last||"")).slice(0, 6)
    .forEach(h => add("Horses", h.name || h.pid, [h.pid && "ID " + h.pid, h.breed, `${h.n} visit(s)`, h.last && "last " + dshow(h.last)].filter(Boolean).join(" · "), () => openPatient(h.pid, h.name)));
  // visits
  S.visits.filter(v => has(v.name, v.pid, v.td, v.complaint, v.rx, v.invest, v.notes, v.disease, v.advice, v.date, dshow(v.date), ...linkedPrev(v).map(p => p.drug)))
    .sort((a,b) => (b.date||"").localeCompare(a.date||"")).slice(0, 8)
    .forEach(v => add("Visits & treatments", `${dshow(v.date)} – ${v.name || v.pid || ""}${v.td ? " – " + v.td : ""}`, gsSnip([v.td, v.complaint, v.rx, v.invest, v.notes, v.disease, v.advice, linkedPrev(v).map(p => p.drug).join(", ")], q) || v.rx || "", () => openVisit(v._id)));
  // vaccination & deworming
  S.preventive.filter(r => has(r.name, r.pid, r.drug, r.note, KLAB[r.kind])).sort((a,b) => (b.given||"").localeCompare(a.given||"")).slice(0, 6)
    .forEach(r => add("Vaccination & deworming", `${KLAB[r.kind] || ""}: ${r.drug || ""}`, `${r.name || r.pid || ""} · given ${r.given ? dshow(r.given) : "–"}${r.next ? " · next " + dshow(r.next) : ""}`, () => editPrev(r.kind, r)));
  // notes
  S.notes.filter(n => has(n.title, n.text, n.name, n.pid)).slice(0, 6)
    .forEach(n => add("Notes", n.title || String(n.text || "").slice(0, 70) || "Note", [n.name, gsSnip([n.text], q), n.done ? "done" : n.due ? "due " + dshow(n.due) : ""].filter(Boolean).join(" · "), () => editClinicNote(n._id)));
  // medicines
  S.meds.filter(m => has(m.name, m.type, m.composition, m.function, m.indication, m.route)).sort((a,b) => (a.name||"").localeCompare(b.name||"")).slice(0, 6)
    .forEach(m => add("Medicines", m.name, `${m.type || ""} · ${stockTxt(m.name)}${m.indication ? " · " + m.indication : ""}`, () => editMed(m._id)));
  // stock
  S.stock.filter(s => has(s.item, s.desc, s.med, s.group, s.rmk)).sort((a,b) => (a.item||"").localeCompare(b.item||"")).slice(0, 6)
    .forEach(s => add("Stock", s.item, `${s.group || (s.med ? "Medicine" : "Other")} · balance ${N(s.balance) === null ? "–" : fmt(s.balance)} · ${stockStatus(s).map(t => t[0]).join(", ")}`,
      () => { stockG = "all"; stockF = "all"; stockQ = s.item || ""; if (location.hash === "#stock") render(true); else location.hash = "#stock"; }));
  // diseases
  diseasesAll().filter(d => has(d.d, d.t, d.s, d.b, d.c)).slice(0, 5)
    .forEach(d => add("Diseases", d.d, `${d.t || ""}${d.s ? " · " + d.s : ""}`, () => editDz(d._chunk, d._i)));
  return out;
}
function gsDraw(){
  const inp = $("#gsq"), box = $("#gsres"); if (!inp || !box) return;
  const raw = inp.value; const q = hk(raw).split(/\s+/).filter(Boolean);
  if (!q.length) { box.hidden = true; box.innerHTML = ""; GS.items = []; return; }
  GS.items = gsSearch(raw); if (GS.hi >= GS.items.length) GS.hi = GS.items.length - 1;
  let g = "";
  box.innerHTML = GS.items.map((it, k) => { const head = it.group !== g ? `<div class="gs-g">${esc(it.group)}</div>` : ""; g = it.group;
    return head + `<button type="button" class="gs-it${k === GS.hi ? " on" : ""}" role="option" data-gk="${k}">${gsHi(it.label, q)}${it.sub ? `<small>${gsHi(it.sub, q)}</small>` : ""}</button>`; }).join("")
    || `<div class="gs-empty">Nothing found for “${esc(raw.trim())}”.</div>`;
  box.hidden = false;
  box.querySelectorAll("[data-gk]").forEach(b => b.addEventListener("mousedown", e => { e.preventDefault(); gsGo(+b.dataset.gk); }));
}
function gsGo(k){
  const it = GS.items[k]; if (!it) return;
  const inp = $("#gsq"), box = $("#gsres"); box.hidden = true; inp.blur();
  document.querySelectorAll(".modal-bg").forEach(x => x.remove());
  it.act();
}
function bindGlobalSearch(){
  const inp = $("#gsq"); if (!inp || inp.dataset.bound) return; inp.dataset.bound = "1";
  inp.addEventListener("input", () => { GS.hi = -1; gsDraw(); });
  inp.addEventListener("focus", () => { if (inp.value.trim()) gsDraw(); });
  inp.addEventListener("blur", () => setTimeout(() => { const b = $("#gsres"); if (b) b.hidden = true; }, 160));
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!GS.items.length) return; GS.hi = Math.max(0, Math.min(GS.items.length - 1, GS.hi + (e.key === "ArrowDown" ? 1 : -1))); gsDraw(); const el = $("#gsres").querySelector(`[data-gk="${GS.hi}"]`); if (el) el.scrollIntoView({block:"nearest"}); }
    else if (e.key === "Enter") { e.preventDefault(); gsGo(GS.hi >= 0 ? GS.hi : 0); }
    else if (e.key === "Escape") { inp.value = ""; gsDraw(); inp.blur(); }
  });
  document.addEventListener("keydown", e => {
    const a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    if ((e.key === "/" && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) { e.preventDefault(); inp.focus(); inp.select(); }
  });
  const hn = $("#hNotes"); if (hn) hn.onclick = () => { location.hash = "#notes"; };
}

/* ---------------- share prescription ---------------- */
async function pdfBlob(inner){
  if (!window.html2pdf) await loadScript(H2P);
  const box = document.createElement("div");
  box.className = "doc"; box.style.cssText = "position:absolute;left:-12000px;top:0;width:186mm;background:#fff";
  box.innerHTML = `<style>${DOC_CSS}</style>` + inner; document.body.appendChild(box);
  try {
    await Promise.all([...box.querySelectorAll("img")].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    return await html2pdf().set({margin:[10,10,12,10], image:{type:"jpeg", quality:0.92}, html2canvas:{scale:2, useCORS:true, backgroundColor:"#ffffff"},
      jsPDF:{unit:"mm", format:"a4", orientation:"portrait"}, pagebreak:{mode:["css","legacy"], avoid:["tr",".dh","figure"]}}).from(box).outputPdf("blob");
  } finally { box.remove(); }
}
function rxShareText(){
  const P = RX, rows = rxRows(), st = ST();
  return [`${st.clinic || "Veterinary clinic"} – Prescription`, `Date: ${dshow(P.date)}`, `Horse: ${P.name || ""}${P.pid ? " (ID " + P.pid + ")" : ""}`,
    P.td ? `T/D: ${P.td}` : "", P.invest ? `Investigations:\n${P.invest}` : "", "", "Rx:",
    ...rows.map((r,i) => `${i+1}. ${r.l.med} – ${r.c.dose !== null ? fmt(r.c.dose,3) + " " + (r.c.basis||"") : ""}${r.c.vol !== null ? ", " + fmt(r.c.vol,1) + " ml" : ""}, ${r.c.route||""}, ${r.c.freq||""}${r.c.days ? " x " + r.c.days + " d" : ""}${r.l.instr ? " (" + r.l.instr + ")" : ""}`),
    P.advice ? `\nAdvice: ${P.advice}` : "", "", P.vet || st.vet || ""].filter((x, i, a) => x !== "" || (a[i-1] !== "" && i)).join("\n").trim();
}
function shareRx(){
  if (!rxRows().length && !RX.name) { toast("Fill in the prescription first."); return; }
  const text = rxShareText(), fname = `Prescription_${slug(RX.name)}_${RX.date}.pdf`;

    <div class="grid g2">

    <p class="small muted" id="shMsg"></p>
    <div class="row" style="margin-top:10px"><span class="spacer"></span><button data-act="close">Close</button></div>`, async (act, close) => {
    if (act === "close") return close();
    const msg = t => { const m = bg.querySelector("#shMsg"); if (m) m.textContent = t; };
    try {
      if (act === "pdf") {
        if (!file) return;
        if (canFiles && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:"Prescription " + (RX.name || ""), text:`Prescription – ${RX.name || ""} – ${dshow(RX.date)}`});
        else { await saveFile(fname, file); msg("This device cannot attach files to apps – the PDF was downloaded instead. Attach it in WhatsApp / email."); }
      }
      if (act === "wa") window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
      if (act === "mail") location.href = `mailto:?subject=${encodeURIComponent("Prescription – " + (RX.name || "") + " – " + dshow(RX.date))}&body=${encodeURIComponent(text)}`;
      if (act === "text") await navigator.share({title:"Prescription", text});
      if (act === "copy") { await navigator.clipboard.writeText(text); toast("Prescription text copied."); }
      if (act === "dl") { if (file) await saveFile(fname, file); else pdfRx(); }

  pdfBlob(sheetHTML()).then(b => { file = new File([b], fname, {type:"application/pdf"}); const btn = bg.querySelector("#shPdf"); if (btn) { btn.disabled = false; btn.textContent = canFiles ? "📄 Share PDF" : "📄 Get PDF to share"; } })
    .catch(() => { const btn = bg.querySelector("#shPdf"); if (btn) { btn.textContent = "PDF not available offline"; } });
}

async function restoreBackup(B){
  const jobs = [];
  if (B.settings) jobs.push(["config/settings", B.settings]);
  if (B.lists) jobs.push(["config/lists", B.lists]);
  const coll = (name, arr) => (arr||[]).forEach(o => { const {_id, ...d} = o; jobs.push([name + "/" + (_id || ("r" + Date.now().toString(36) + Math.random().toString(36).slice(2,7))), d]); });
  coll("meds", B.meds); coll("doses", B.doses); coll("stock", B.stock); coll("visits", B.visits); coll("preventive", B.preventive); coll("notes", B.notes);
  if (B.diseases) { const per = Math.ceil(B.diseases.length/4); for (let c=0;c<4;c++) jobs.push(["dchunks/c"+c, {items:B.diseases.slice(c*per,(c+1)*per)}]); }
  let n = 0;
  for (const [p, d] of jobs) {
    try { await W(() => db.doc(p).set(JSON.parse(JSON.stringify(d, (k,v)=> v===undefined?null:v)))); } catch(e){ toast("Restore stopped at " + p); return; }
    n++; const m = $("#rsMsg"); if (m) m.textContent = `Restored ${n} of ${jobs.length}…`;
    if (MODE === "firebase") await sleep(40);
  }
  toast(`Restore finished – ${n} records.`, 4000);
}
async function saveLists(freqs){

}

/* ---------------- modal helpers ---------------- */
function modal(html, onAct){
  const bg = document.createElement("div"); bg.className = "modal-bg"; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => { bg.remove(); render(true); };
  bg.addEventListener("click", async e => { if (e.target === bg) return close(); const a = e.target.closest("[data-act]"); if (!a) return;
    try { await onAct(a.dataset.act, close); } catch(err){} });
  const first = bg.querySelector("input,select,textarea,button"); if (first) first.focus();
}
function confirmBox(text, yes){
  modal(`<h2>Please confirm</h2><p>${esc(text)}</p><div class="row"><span class="spacer"></span><button data-act="no">Cancel</button><button class="pri" data-act="yes">Yes</button></div>`, async (a, close) => {
    const bg = document.querySelectorAll(".modal-bg"); bg[bg.length-1].remove();
    if (a === "yes") await yes();
    render(true);
  });
}

let MODE = "local", USER_EMAIL = "";
dl = { save: async ({filename, data}) => {
  const blob = data instanceof Blob ? data : new Blob([data], {type: /\.json$/.test(filename) ? "application/json" : /\.csv$/.test(filename) ? "text/csv" : "text/html"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return {status:"saved"}; } };
function makeLocalDB(){
  const KEY = "equineClinicData_v1"; let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ data = {}; }
  const listeners = [];
  let saveT = null;
  const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ toast("Browser storage is full – download a backup and set up Firebase."); } }, 250); };
  window.addEventListener("beforeunload", () => { if (saveT) { clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} } });
  const split = p => { const i = p.lastIndexOf("/"); return [p.slice(0,i), p.slice(i+1)]; };
  const gid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const meta = {fromCache:false, hasPendingWrites:false};
  const snapCol = c => { const o = data[c] || {}; const docs = Object.keys(o).sort().map(id => ({id, exists:true, data:() => o[id], metadata:meta})); return {docs, size:docs.length, empty:!docs.length, metadata:meta}; };
  const snapDoc = p => { const [c,id] = split(p); const v = (data[c]||{})[id]; return {id, exists:!!v, data:() => v, metadata:meta}; };
  const notify = c => listeners.slice().forEach(l => { if (l.t === "c" && l.p === c) l.cb(snapCol(c)); if (l.t === "d" && split(l.p)[0] === c) l.cb(snapDoc(l.p)); });
  const listen = (t, p, cb, first) => { const l = {t, p, cb}; listeners.push(l); setTimeout(() => cb(first()), 0); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i,1); }; };
  const docRef = p => ({ id: split(p)[1], path: p,
    get: async () => snapDoc(p),
    set: async v => { const [c,id] = split(p); (data[c] = data[c] || {})[id] = JSON.parse(JSON.stringify(v)); save(); notify(c); },
    update: async v => { const [c,id] = split(p); if (!data[c] || !data[c][id]) throw {code:"invalid_argument", message:"Record not found"}; Object.assign(data[c][id], JSON.parse(JSON.stringify(v))); save(); notify(c); },
    delete: async () => { const [c,id] = split(p); if (data[c]) delete data[c][id]; save(); notify(c); },
    onSnapshot: cb => listen("d", p, cb, () => snapDoc(p)) });
  const colRef = p => ({ path: p,
    doc: id => docRef(p + "/" + (id || gid())),
    add: async v => { const r = docRef(p + "/" + gid()); await r.set(v); return r; },
    where: (f, op, val) => ({ get: async () => { const s = snapCol(p); const docs = s.docs.filter(d => d.data()[f] === val); return {docs, size:docs.length, empty:!docs.length, metadata:meta}; } }),
    get: async () => snapCol(p),
    onSnapshot: cb => listen("c", p, cb, () => snapCol(p)) });
  return { doc: docRef, collection: colRef };
}
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.appendChild(s); }); }

(async () => {
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.apiKey) {
    MODE = "firebase"; setStatus("Connecting…");
